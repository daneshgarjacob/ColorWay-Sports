      - paragraph [ref=e856]: "Ecuador against Curaçao is a sun-and-sea color clash that pops off the screen. La Tri came in their first-choice yellow, the bright Marathon home shirt with navy collar and cuffs, red trim, and the FEF crest on the chest — one of the most vivid base colors any nation brings to the tournament. Curaçao answered in the royal-blue adidas home that turned heads against Germany, deep cobalt carrying the yellow-and-cyan Korsou flag accents on the shoulder, a tiny Caribbean nation looking every bit like it belongs. Bright yellow against royal blue is one of the great high-contrast pairings in the sport: the two shirts separate instantly and read vividly from the back row and on the broadcast, and Curaçao's flag-yellow detailing quietly echoes Ecuador's primary so the matchup feels almost designed. It lands just shy of the perfect 10s only because yellow-against-blue, for all its punch, never quite detonates the way the pure orange-against-blue complementary clashes do — but this is top-tier stuff, saturated and joyful from both ends of the pitch. Nine and a half out of 10."
