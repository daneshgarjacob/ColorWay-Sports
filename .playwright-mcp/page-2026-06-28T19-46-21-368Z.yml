      - paragraph [ref=e1501]: "Score: 7 / 10"
      - paragraph [ref=e1502]: "The first men's World Cup match ever played in Canada, and the kits met the moment cleanly: Canada in the home red at BMO Field, Bosnia and Herzegovina in the away white, the cleanest pairing the fixture can produce. The Bosnia change shirt remains one of the tournament's quiet sleepers, a Kelme design from Sarajevo designer Haris Stambolic with a white base, blue raglan sleeves, and thin blue and yellow pinstripes, and the maple leaf red against it read exactly as advertised in Toronto. But like Korea against Czechia the night before, the pairing tops out at standard-issue red-versus-white, and the pinstripes that make the Bosnia shirt special on the rack are invisible from broadcast distance. Seven out of 10. Canadian soccer's biggest home afternoon ever looked clean, classic, and just a little safe."
