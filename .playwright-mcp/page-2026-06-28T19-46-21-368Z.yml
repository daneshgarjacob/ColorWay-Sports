  - main [ref=e59]:
    - article [ref=e60]:
      - img "2026 FIFA World Cup Jersey Tracker cover composite for the ColorWay Sports running tracker grading every match kit pairing across all 48 teams 12 groups and 104 matches of the 2026 FIFA World Cup hosted by the United States Canada and Mexico from June 11 through July 19 2026" [ref=e62]
      - paragraph [ref=e63]: The 2026 FIFA World Cup is the first 48-team World Cup in tournament history, co-hosted by the United States, Canada, and Mexico across 16 host cities, with 104 matches across 39 days from June 11 through the Final on July 19, 2026. This is the running ColorWay Sports tracker grading every match kit and uniform pairing across the entire tournament. Every match gets a grade, every kit matchup gets analyzed, every Adidas, Nike, Puma, and other-brand reveal gets tracked. Live updates from kickoff in Group A through the Final.
      - link "Interactive Tool Fill out your World Cup bracket → All 32 knockout teams are locked. Tap to pick winners from the Round of 32 to the Final, see who your team could play next, and share your bracket." [ref=e64] [cursor=pointer]:
        - /url: /world-cup-rooting-guide
        - generic [ref=e65]: Interactive Tool
        - generic [ref=e66]: Fill out your World Cup bracket →
        - generic [ref=e67]: All 32 knockout teams are locked. Tap to pick winners from the Round of 32 to the Final, see who your team could play next, and share your bracket.
      - heading "What This Tracker Grades" [level=2] [ref=e68]
      - paragraph [ref=e69]: We grade every match kit and uniform pairing for visual contrast, color cohesion, and broadcast read. Each match gets a letter or numeric grade based on how the home team's chosen kit and the away team's chosen kit pair against the pitch, the broadcast frame, and each team's brand identity. We track every home kit + away kit decision at the group stage and through every knockout round, and we flag the games where one team's choice elevates or downgrades the pairing.
      - paragraph [ref=e70]: For the standalone rankings of every individual home kit, away kit, and third kit released for the 2026 World Cup, see our content cluster of ranking posts at the bottom of this tracker. This tracker is the live MATCH-BY-MATCH grading layer that sits on top of those rankings as the tournament plays.
