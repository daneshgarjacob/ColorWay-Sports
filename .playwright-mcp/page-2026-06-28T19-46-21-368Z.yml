      - paragraph [ref=e898]: "Netherlands against Sweden is a complementary-color knockout and the tournament's newest perfect 10. Orange versus blue sit directly opposite each other on the color wheel — the single most powerful contrast in the sport — and both teams brought fully saturated, beautifully made versions of it. The Dutch came in the iconic Oranje home, that unmistakable burnt-orange Nike shirt with the black lion crest and tonal trim, one of the most recognizable kits on the planet. Sweden answered not in their usual yellow but in the blue adidas away, and it might be the best change shirt of the entire tournament: a deep royal blue laced with tonal gold filigree scrollwork, gold trim, and the Sverige crest, a retro-modern stunner. Orange against that blue detonates at every distance — on the broadcast, from the back row, on a phone screen — with zero muddiness and no clash to engineer around. Both shirts are gorgeous on their own and electric together. There is nothing to dock. Ten out of 10, and one of the best-looking matchups we have graded all tournament."
