      - heading "Frequently Asked Questions" [level=2] [ref=e1631]
      - paragraph [ref=e1632]:
        - strong [ref=e1633]: When does the 2026 FIFA World Cup start and end?
      - paragraph [ref=e1634]: The 2026 FIFA World Cup runs from June 11, 2026 (Opener) through July 19, 2026 (Final). The Opener is Mexico vs South Africa at Estadio Azteca in Mexico City, and the Final is at MetLife Stadium in East Rutherford, New Jersey. The tournament runs 39 days end to end and covers 104 matches across 16 host cities in three host countries.
      - paragraph [ref=e1635]:
        - strong [ref=e1636]: Who is hosting the 2026 FIFA World Cup?
      - paragraph [ref=e1637]: The 2026 FIFA World Cup is co-hosted by the United States, Canada, and Mexico. The USA hosts 11 of the 16 host cities, Canada hosts 2, and Mexico hosts 3. The Final is in East Rutherford, New Jersey at MetLife Stadium and the Opener is in Mexico City at Estadio Azteca.
      - paragraph [ref=e1638]:
        - strong [ref=e1639]: How many teams are in the 2026 FIFA World Cup?
      - paragraph [ref=e1640]: The 2026 FIFA World Cup is the first 48-team World Cup in tournament history, expanded from the previous 32-team format. The 48 teams are split into 12 groups of 4 teams each for the group stage.
      - paragraph [ref=e1641]:
        - strong [ref=e1642]: How many matches are in the 2026 FIFA World Cup?
      - paragraph [ref=e1643]: "The 2026 FIFA World Cup has 104 total matches: 72 group stage matches (12 groups × 6 matches per group) plus 32 knockout round matches (Round of 32, Round of 16, Quarterfinals, Semifinals, Third Place, and Final)."
      - paragraph [ref=e1644]:
        - strong [ref=e1645]: What is the format of the 2026 FIFA World Cup knockout stage?
      - paragraph [ref=e1646]: The expanded 48-team format introduces a Round of 32 for the first time in World Cup history. The top 2 teams from each of the 12 groups plus the 8 best 3rd-place finishers across all 12 groups advance to the Round of 32. From there it is straight knockout through the Round of 16, Quarterfinals, Semifinals, Third Place playoff, and the Final.
      - paragraph [ref=e1647]:
        - strong [ref=e1648]: Which teams are in Group A of the 2026 FIFA World Cup?
      - paragraph [ref=e1649]: Group A of the 2026 FIFA World Cup features the host nation Mexico, South Africa, South Korea, and Czechia, who qualified through the UEFA play-offs in March 2026. Group A opened the tournament at Estadio Azteca in Mexico City on June 11, 2026, with Mexico vs South Africa.
      - paragraph [ref=e1650]:
        - strong [ref=e1651]: Which teams are in Group D with the United States?
      - paragraph [ref=e1652]: Group D features the United States, Paraguay, Australia, and Türkiye. The United States Men's National Team plays its group stage matches as the host of Group D across multiple US venues.
      - paragraph [ref=e1653]:
        - strong [ref=e1654]: Which group is the defending champion Argentina in?
      - paragraph [ref=e1655]: Argentina, the 2022 FIFA World Cup champions, are in Group J alongside Algeria, Austria, and Jordan.
