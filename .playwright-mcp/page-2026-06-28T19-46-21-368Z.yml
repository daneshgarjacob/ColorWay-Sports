      - paragraph [ref=e1444]: "Score: 10 / 10"
      - paragraph [ref=e1445]: "This is the one. Brazil against Morocco is the platonic ideal of a World Cup kit matchup, and it earns the tracker's first perfect score. Both teams came out in their first-choice home kits — no clash, no compromise, no change shirt forced by a color conflict — and the result is a full four-color spectacle: Brazil's canary yellow over blue shorts against Morocco's red over green. Yellow versus red is already a top-tier pairing, both fully saturated, both reading instantly from the back row and on every broadcast angle. Then add the secondaries — Brazil's blue, Morocco's green — and all four colors of two of the most beloved identities in the sport are on the grass at the same time. The amarelinha is the most famous shirt in football; Morocco's red-and-green is one of the boldest looks of the modern era; and together they do not fight, they complete each other. Earlier matchups topped out because a tonal print washed out at distance or a pairing never rose past red-versus-white. This one has none of those problems. There is nothing to dock: both teams in their best, a color story that detonates at every distance, zero conflict to engineer around. Ten out of 10. We would watch it on mute just for the kits."
