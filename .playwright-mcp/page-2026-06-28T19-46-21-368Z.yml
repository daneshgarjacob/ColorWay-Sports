      - paragraph [ref=e1520]: "Score: 7 / 10"
      - paragraph [ref=e1521]: "Group A's second game handed FIFA the tournament's first kit conflict, and it resolved exactly as projected. South Korea's home shirt is red, Czechia's home shirt is red, and as the listed home team the Taegeuk Warriors kept the tiger-print red while Czechia came out in the away shirt for their first World Cup match since 2006: an icy crystal white loaded with a tonal print pulled from Bohemian cut glass, finished with gold on the collar and a gold double-tailed lion on the crest. Red against crystal white reads cleanly on the Estadio Akron grass and the gold Czech trim is a quiet luxury detail, but the pairing never rises past standard-issue red-versus-white, and Korea's tiger print mostly disappears at broadcast distance. Seven out of 10. Czechia's twenty-year World Cup return got a clean visual landing."
