      - paragraph [ref=e1539]: "Score: 7.5 / 10"
      - paragraph [ref=e1540]: "The 2026 World Cup opens with a kit pairing sixteen years in the making. Mexico against South Africa is the exact fixture that opened the 2010 World Cup at Soccer City in Johannesburg, on the exact same date, June 11, and now the kit story comes full circle with the host roles reversed. South Africa's canary gold home shirt is a direct tribute to the one Bafana Bafana wore that day in 2010, when Siphiwe Tshabalala hammered the tournament's opening goal past Mexico and gave the World Cup one of its most replayed goal celebrations. Mexico answers with the strongest home identity in CONCACAF, the deep verde loaded with a tonal Aztec sun stone print that reads nearly solid green from broadcast distance and rewards every close-up. Green against gold is a top-shelf color pairing in concept, and both teams showing up to a World Cup opener in their first-choice home looks is exactly how a tournament should start. But the broadcast told on this one: Mexico's tonal Aztec print reads as flat dark green from distance, South Africa's green trim blurs the separation in every wide shot, and a pairing that is a 10 on paper landed as merely good on screen. We are calling it a 7.5. The history is a 10; the contrast is not."
