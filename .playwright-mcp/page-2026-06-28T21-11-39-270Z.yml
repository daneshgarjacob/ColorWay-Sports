    - generic [ref=e335]:
      - heading "How the 2026 World Cup bracket predictor works" [level=2] [ref=e336]
      - paragraph [ref=e337]: This is a free, interactive 2026 World Cup bracket you fill out yourself. Start in the Round of 32, tap a winner in every matchup, and each pick auto-advances to the next round so the bracket builds itself all the way to the Final. Change your mind on an earlier round and everything downstream re-routes instantly. On phones the bracket flips to a clean round-by-round view, and on desktop you get the full knockout bracket from the Round of 32 to the champion.
      - paragraph [ref=e338]: As each World Cup knockout game is played, the real result locks into the bracket and marks that matchup Final, so the tool doubles as a live 2026 World Cup bracket and your own predictor at the same time. Crown your champion, then use the share button to save a bracket image for your group chat or social.
      - heading "Frequently asked questions" [level=2] [ref=e339]
      - generic [ref=e340]:
        - generic [ref=e341]:
          - paragraph [ref=e342]: How do I fill out a 2026 World Cup bracket?
          - paragraph [ref=e343]: Tap the team you think wins in each Round of 32 matchup above. Your pick advances to the next round automatically. Keep picking through the Round of 16, quarterfinals, semifinals, and Final to crown your champion. Your bracket saves on your device, so you can come back and edit it anytime.
        - generic [ref=e344]:
          - paragraph [ref=e345]: Which 32 teams are in the 2026 World Cup knockout bracket?
          - paragraph [ref=e346]: The Round of 32 features the 12 group winners, 12 runners-up, and the eight best third-place teams from the 2026 FIFA World Cup group stage. All 32 are locked into the bracket above in their official knockout positions.
        - generic [ref=e347]:
          - paragraph [ref=e348]: Does the bracket update with real World Cup results?
          - paragraph [ref=e349]: Yes. As each knockout game finishes, the actual winner locks into the bracket and the matchup is marked Final, while every game that has not been played stays open for you to predict.
      - paragraph [ref=e350]: Round of 32 matchups and bracket order follow the official 2026 FIFA World Cup knockout draw. Built on an idea from Jonah.
