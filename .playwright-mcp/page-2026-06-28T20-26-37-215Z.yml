  - main [ref=e59]:
    - article [ref=e60]:
      - blockquote [ref=e62]:
        - link:
          - /url: https://twitter.com/WashWizards/status/2070533865978966332
      - paragraph [ref=e63]: "The 2026 NBA Draft is in the books, and the fun part for us starts now: seeing every new pick in their new team jersey and uniform for the first time. This is the running ColorWay Sports tracker for the rookie class of 2026, matching all 30 first-round picks to the team colorway they just stepped into. We are leading with each team's official welcome post so you can see the jersey on the player, and we will keep adding the rest of the first round plus real on-court uniform shots as Las Vegas Summer League tips off in July."
      - paragraph [ref=e64]: A quick note on what you are looking at. On draft night the picks hold up the jersey and pull on the team cap, so these first looks are the welcome graphics and the on-stage jersey reveals rather than full game uniforms. The true on-court uniform look lands at Summer League, and we will swap those in as they come. For now, here is how the new colorways look on the top of the 2026 board.
      - 'heading "No. 1: AJ Dybantsa, Washington Wizards" [level=2] [ref=e65]'
      - paragraph [ref=e66]: The Washington Wizards landed the top pick and used it on BYU wing AJ Dybantsa, who now slides into the Wizards' navy, red, and silver. Washington's red, white, and blue color story is one of the cleaner identities in the league, and the bold red jersey gives Dybantsa a uniform that reads loud on the broadcast from day one. It is a strong, classic look for a franchise cornerstone, and the colorway suits him.
      - 'heading "No. 2: Darryn Peterson, Utah Jazz" [level=2] [ref=e67]'
      - blockquote [ref=e69]:
        - link:
          - /url: https://twitter.com/utahjazz/status/2071055522925822354
      - paragraph [ref=e70]: Kansas guard Darryn Peterson heads to the Utah Jazz, stepping into one of the more distinctive jersey and uniform palettes in the NBA. The Jazz lean on their deep mountain color direction, and Utah's set gives Peterson a moody, modern look with the kind of contrast that photographs well. It is a sharp landing spot for a guard who is going to be on a lot of highlight reels in this uniform.
      - 'heading "No. 3: Cameron Boozer, Memphis Grizzlies" [level=2] [ref=e71]'
      - blockquote [ref=e73]:
        - link:
          - /url: https://twitter.com/memgrizz/status/2070656464897601836
      - paragraph [ref=e74]: Duke forward Cameron Boozer joins the Memphis Grizzlies and their Beale Street blue. Memphis runs one of the most underrated color stories in the league, the navy and the lighter blue layered with the gold accents, and it gives Boozer a jersey and uniform that feels both fresh and grown-up. The Grizzlies colorway has always read well on bigger forwards, and Boozer fits the frame.
      - 'heading "No. 4: Caleb Wilson, Chicago Bulls" [level=2] [ref=e75]'
      - blockquote [ref=e77]:
        - link:
          - /url: https://twitter.com/chicagobulls/status/2070636125849370762
      - paragraph [ref=e78]: UNC forward Caleb Wilson lands with the Chicago Bulls, which means he inherits one of the most iconic jerseys in basketball. The Bulls' red, black, and white uniform needs no introduction, and there is a real weight to seeing a new name pull it on. The colorway does a lot of the work here, and Wilson steps straight into one of the most recognizable looks the sport has ever produced.
      - 'heading "No. 5: Keaton Wagler, LA Clippers" [level=2] [ref=e79]'
      - blockquote [ref=e81]:
        - link:
          - /url: https://twitter.com/LAClippers/status/2070188703033725279
      - paragraph [ref=e82]: Illinois guard Keaton Wagler rounds out the top five with the LA Clippers, stepping into the team's rebuilt blue and red identity from the Intuit Dome era. The Clippers cleaned up their jersey and uniform direction in recent seasons, and the result is a crisp, contemporary colorway that gives Wagler a modern look to launch his career in.
      - heading "The Rest of the 2026 First Round" [level=2] [ref=e83]
      - paragraph [ref=e84]: "We are building out the full first round next, adding each team's welcome reveal and the on-court uniform shots from Summer League. Here is the rest of the 2026 first-round board and the colorway each pick is joining:"
