      - heading "Frequently Asked Questions" [level=2] [ref=e112]
      - paragraph [ref=e113]:
        - strong [ref=e114]: Who was the No. 1 pick in the 2026 NBA Draft?
      - paragraph [ref=e115]: The Washington Wizards selected BYU wing AJ Dybantsa with the No. 1 overall pick in the 2026 NBA Draft. He now steps into the Wizards' navy, red, and silver uniform as the new face of the Washington rebuild.
      - paragraph [ref=e116]:
        - strong [ref=e117]: Which 2026 NBA Draft picks have their new jerseys revealed?
      - paragraph [ref=e118]: Every first-round pick has been matched to their new team and shown in that team's colorway through the official welcome posts. The top five so far are AJ Dybantsa with the Washington Wizards, Darryn Peterson with the Utah Jazz, Cameron Boozer with the Memphis Grizzlies, Caleb Wilson with the Chicago Bulls, and Keaton Wagler with the LA Clippers. We are adding the full first round and the on-court uniform shots from Summer League.
      - paragraph [ref=e119]:
        - strong [ref=e120]: When will we see the 2026 rookies in their actual game uniforms?
      - paragraph [ref=e121]: The first true on-court uniform looks for the 2026 rookie class come at NBA Summer League in Las Vegas in July 2026. Draft-night photos show the picks holding the jersey and wearing the team cap, while Summer League is the first time they play in the full team uniform. We will update this tracker with those shots as they happen.
      - paragraph [ref=e122]:
        - strong [ref=e123]: What NBA team did Cameron Boozer get drafted to?
      - paragraph [ref=e124]: Duke forward Cameron Boozer was selected by the Memphis Grizzlies in the 2026 NBA Draft. He joins the Grizzlies' Beale Street blue, navy, and gold color scheme, one of the more underrated jersey and uniform palettes in the league.
      - paragraph [ref=e125]:
        - strong [ref=e126]: Where can I find every 2026 NBA Draft pick and their new team?
      - paragraph [ref=e127]: This ColorWay Sports tracker lists all 30 first-round picks of the 2026 NBA Draft with the team that drafted them and the new colorway each player is joining, from the No. 1 pick down through No. 30. We update it with each new jersey and uniform first look as they roll out.
      - heading "The Bottom Line on the 2026 Draft Class's New Uniforms" [level=2] [ref=e128]
      - paragraph [ref=e129]: The best part of any draft is the colorway reveal, and the 2026 class landed in some strong jerseys and uniforms at the top of the board. Dybantsa gets the bold Wizards red, Boozer steps into Memphis blue, and Wilson pulls on one of the most iconic looks in the sport with the Bulls. We will keep this tracker live as the rest of the first round gets its team welcome and as the full on-court uniforms show up at Summer League. Bookmark it and check back for every new look.
