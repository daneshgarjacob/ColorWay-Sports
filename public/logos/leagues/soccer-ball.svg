<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Soccer">
  <!-- Reads at 18px, which is the whole job. Solid ball, white panels punched
       out: thin dark seams on a white ball turn to mush at nav size, so the
       contrast is inverted instead. -->
  <defs>
    <clipPath id="sb"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="30" fill="currentColor"/>
  <g clip-path="url(#sb)" fill="#ffffff">
    <!-- centre pentagon, point up -->
    <path d="M32 13.4l15.3 11.1-5.8 18h-19L16.7 24.5z" transform="scale(0.72) translate(12.4 12.4)"/>
    <!-- three shoulder panels -->
    <path d="M32 1.5l12 8.7-4.6 6.3H24.6L20 10.2z"/>
    <path d="M2.6 27.4l9.9 7.2-3.8 11.6-11.7-.1-3.6-11.1z"/>
    <path d="M61.4 27.4l9.2 7.6-3.6 11.1-11.7.1-3.8-11.6z"/>
    <!-- two lower panels -->
    <path d="M22.4 52.6h7.2l3.9 12-9.4 5.2-8.6-6.3z"/>
    <path d="M41.6 52.6l6.9 10.9-8.6 6.3-9.4-5.2 3.9-12z"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>
